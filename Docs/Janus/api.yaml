      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                login:
                  type: string
                nick:
                  type: string
                body:
                  type: string
      responses:
        '201':
          description: Post created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/msgboard/{id}:
    get:
      operationId: getMsgboardPost

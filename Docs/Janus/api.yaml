        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                path:
                  type: array
                  items:
                    type: string
                name:
                  type: string
                kind:
                  type: string
                  enum: [category, bundle]
                  default: bundle
      responses:
        '201':
          description: Category created
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'


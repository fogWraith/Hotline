          description: Post not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/msgboard/by-ip/{ip}:
    delete:
      operationId: deleteMsgboardPostsByIP
      summary: Delete all posts by IP
      x-required-role: admin
      description: >
        Deletes all message board posts from the given IP address.
        Use the `since` query parameter to limit deletion to a time window.
      tags: [Message Board]
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
          description: IP address to match
        - name: since
          in: query
          schema:
            type: string
          description: >
            Time window for deletion. Accepts any Go duration string
            (e.g. "30m", "1h", "24h") plus day/week shorthand ("7d",
            "30d", "1w") or "all". Default is "all" (delete everything
            from this IP).
      responses:
        '200':
          description: Posts deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                      ip:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- News Categories ---
  /api/v2/news/categories:

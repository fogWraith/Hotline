            type: integer
      responses:
        '200':
          description: Post details
        '400':
          description: Invalid post ID
        '404':
          description: Post not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateMsgboardPost
      summary: Update a post body
      x-required-role: operator
      tags: [Message Board]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '200':
          description: Post updated
        '400':
          description: Invalid post ID, or an empty body
        '404':
          description: Post not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteMsgboardPost
      summary: Delete a post
      x-required-role: operator
      tags: [Message Board]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Post deleted
        '400':
          description: Invalid post ID

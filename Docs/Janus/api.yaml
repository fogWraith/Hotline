  /api/v2/files/by-ip/{ip}:
    delete:
      operationId: deleteFilesByIP
      summary: Delete all files uploaded by IP
      x-required-role: admin
      description: >
        Deletes every file uploaded from the given IP address. The files are
        found in Janus's own provenance index, not by walking metadata sidecars,
        and each is deleted through the store serving its own file root — so
        this works on a host-directory file area, an HFS+ volume, or a server
        that mixes them.


        Partial failure is reported as success with a count: some files may be
        undeletable, and an operator who asked for twelve needs to know that
        eleven went. A file's provenance record is dropped only after the file
        itself is gone, so a second call retries whatever failed.
      tags: [Files]
      parameters:
        - name: ip
          in: path
          required: true
          schema:
            type: string
          description: IP address to match
      responses:
        '200':
          description: Files deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      deleted:
                        type: integer
                      ip:
                        type: string
                      paths:
                        type: array
                        items:
                          type: string
                        description: >
                          Paths of the deleted files, relative to the file root
                          each lived in. The root itself is not reported, so
                          files of the same relative path in two different
                          roots appear as identical entries.
        '400':
          description: No IP address was given in the path
        '500':
          description: Nothing could be deleted
        '503':
          description: This server does not record who uploaded files
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Volumes ---
  /api/v2/volumes:
    get:
      operationId: listVolumes
      summary: List volume-backed file areas
      x-required-role: admin
      description: >
        Reports every file root backed by an HFS+ volume image, whether or not
        it mounted.


        An unmounted root is the most important entry on this list. Such a root
        serves nothing and does **not** fall back to the host filesystem, so
        omitting it would make a broken file area look like one nobody
        configured.


        A fixed-size volume runs out in three different ways and each is
        reported separately, because they call for different responses. There
        may be no room at all, which needs deletions. There may be room but not
        in one piece, which is recoverable by migrating to a new volume without
        deleting anything — Hotline announces a transfer's size up front
        precisely so a file can be placed whole. Or there may be room for the
        bytes and no room in the catalog to record the file, which has been
        observed with hundreds of megabytes still free.


        Administrator only: the response exposes the server's filesystem layout.
      tags: [Volumes]
      responses:
        '200':
          description: Volume status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      volumes:
                        type: array
                        items:
                          $ref: '#/components/schemas/VolumeStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: This server's file area is a host directory, not a volume
    post:
      operationId: createVolume
      summary: Create a volume image for a file area
      x-required-role: admin
      description: >
        Creates a new, empty HFS+ volume image for a file root. The image is
        written beside the root, at `<file_root>.hfs` — never inside it, since a
        root that is a *file* would break every tool that expects to be able to
        look inside a file area.


        **There is no resize.** A volume's size is fixed at creation. Growing one
        in place means extending the allocation file, relocating the alternate
        volume header, and rewriting both the partition map and the HFS wrapper,
        every one of which is a way to destroy a file area. "Resizing" therefore
        means creating a second, larger volume and migrating into it — which is
        not a cheap operation, and is deliberately not presented as one. The
        original stays intact until the operator is satisfied, and it is the only
        version of this that is safe to interrupt.


        An existing image is never overwritten, and a file root that is already
        mounted is refused: its image is open, exclusively locked, and being
        written to. Replacing a live file area means stopping the server.


        `file_root` must be this server's file root or one assigned to an
        account. Without that restriction this endpoint would write a
        multi-gigabyte file anywhere the process can reach, somewhere the server
        would never serve — so nobody would notice until the disk filled.


        The new volume is **not** mounted by the running server; volumes are
        mounted at startup. Restart to bring it into use.


        Administrator only.
      tags: [Volumes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_root]
              properties:
                file_root:
                  type: string
                  description: >
                    The file area this volume serves. Must be the server's file
                    root or one assigned to an account.
                size_bytes:
                  type: integer
                  format: int64
                  description: >
                    Fixed size of the volume. Omit to resolve it the way the
                    server would: the account's DiskQuota, then the server's,
                    then Storage.HFSPlus.DefaultVolumeSize, then 500 MiB.
                name:
                  type: string
                  description: >
                    Volume name as the Finder shows it. Defaults to the file
                    root's own directory name.
                bare:
                  type: boolean
                  description: >
                    Write a raw volume with no partition map. The default is a
                    full disk image, which is what period hardware and emulators
                    expect.
                no_drivers:
                  type: boolean
                  description: >
                    Omit the Apple disk drivers. **Mac OS 9 will not mount a disk
                    without them**, so this is almost never what you want; it
                    exists for images that will only ever be read by macOS,
                    hdiutil, an emulator that attaches a file directly, or Janus
                    itself.
      responses:
        '201':
          description: Volume created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      file_root:
                        type: string
                      image_path:
                        type: string
                      size_bytes:
                        type: integer
                        format: int64
                      name:
                        type: string
                      note:
                        type: string
        '400':
          description: Missing file_root, or a path that is not a configured file root
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: An image already exists, or the file root is already mounted


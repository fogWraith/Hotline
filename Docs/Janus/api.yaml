                      total_files:
                        type: integer
                      total_dirs:
                        type: integer
                      total_bytes:
                        type: integer
                        format: int64
                      disk_quota:
                        type: integer
                        format: int64
                      usage_pct:
                        type: number
                        format: float
        '404':
          description: Account not found
        '500':
          description: Failed to query the disk catalog
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- File Search ---
  /api/v2/files/search:
    get:
      operationId: searchFiles
      summary: Search files by modification date
      x-required-role: viewer
      description: >
        Returns files modified at or after the specified timestamp,
        served from the disk catalog.
      tags: [Files]
      parameters:
        - name: mod_after
          in: query
          required: true
          schema:
            type: string
          description: RFC3339 timestamp or Unix epoch seconds
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: >
            Maximum number of results. Values above 1000 are clamped to
            1000; a non-numeric or non-positive value falls back to 100.
      responses:
        '200':
          description: File search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              type: string
                            name:
                              type: string
                            size:
                              type: integer
                              format: int64
                            mod_time:
                              type: integer
                              format: int64
                            type:
                              type: string
                      total:
                        type: integer
        '400':
          description: Missing or invalid `mod_after` parameter
        '500':
          description: Failed to query the disk catalog
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Usage History ---
  /api/v2/usage-history:
    get:
      operationId: getUsageHistory
      summary: Rolling 24-hour user-count summary
      x-required-role: viewer
      description: |
        Returns the current concurrent user count plus 24h peak and average
        derived from the in-process ring buffer. Peak/average remain 0
        until the warm-up threshold (60 samples / 1 hour) is reached.
      tags: [Status]
      responses:
        '200':
          description: Usage summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      current_users:
                        type: integer
                      sample_count:
                        type: integer
                      peak_24h:
                        type: integer
                      avg_24h:
                        type: integer
                      started_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/usage-history/samples:
    get:
      operationId: getUsageHistorySamples
      summary: Raw 24-hour user-count ring buffer
      x-required-role: viewer
      description: |
        Returns the underlying 1-minute samples in chronological order
        (oldest first). The series is at most 1440 entries (24h).
      tags: [Status]
      responses:
        '200':
          description: Sample series
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      samples:
                        type: array
                        items:
                          type: integer
                      count:
                        type: integer
                      started_at:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Diagnostics ---
  /api/v2/diagnostics/runtime:
    get:
      operationId: getRuntimeDiagnostics
      summary: Go runtime diagnostics
      x-required-role: admin
      description: |
        Returns live `runtime.NumGoroutine`, `runtime.MemStats` highlights,
        Go version, CPU count, and process uptime. Intended for operator
        dashboards and on-call debugging.
      tags: [Status]
      responses:
        '200':
          description: Runtime snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      goroutines:
                        type: integer
                      mem_alloc_bytes:
                        type: integer
                        format: int64
                      mem_sys_bytes:
                        type: integer
                        format: int64
                      num_gc:
                        type: integer
                        format: int64
                      uptime_seconds:
                        type: integer
                        format: int64
                      go_version:
                        type: string
                      num_cpu:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/auto-bans:
    get:
      operationId: listAutoBans
      summary: List IPs currently tracked for rate-limit violations
      x-required-role: admin
      description: |
        Returns the list of IP addresses that have tripped the per-IP
        connect rate limiter at least once within the current probe
        window. Each entry shows the rolling violation count and the
        start of the current window; an IP is auto-banned once `count`
        reaches the configured threshold (see `ConnectionRateBanThreshold`).
        Entries are pruned automatically when their window expires.
      tags: [Status]
      responses:
        '200':
          description: Auto-ban probe snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            ip:
                              type: string
                            count:
                              type: integer
                            window_started:
                              type: string
                              format: date-time
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Messaging (instant messaging extension) ---
  /api/v2/messaging/metrics:
    get:
      operationId: getMessagingMetrics
      summary: Messaging metrics
      x-required-role: viewer
      description: >-
        Returns cumulative instant-messaging counters and the current
        offline-queue depth. Requires the messaging extension to be enabled.
      tags: [Messaging]
      responses:
        '200':
          description: Messaging metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      counters:
                        type: object
                        properties:
                          im_sent:
                            type: integer
                            description: Instant messages accepted (online + queued).
                          im_delivered_online:
                            type: integer
                            description: Messages delivered to at least one live session at send time.
                          im_queued_offline:
                            type: integer
                            description: Messages spooled for an offline recipient.
                          friend_requests:
                            type: integer
                          file_offers:
                            type: integer
                          call_invites:
                            type: integer
                      offline_queue:
                        type: object
                        properties:
                          messages:
                            type: integer
                            description: Total undelivered messages currently queued.
                          recipients:
                            type: integer
                            description: Distinct recipients awaiting queued messages.
        '404':
          description: Messaging extension not enabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/messaging/rosters/{login}:
    get:
      operationId: getMessagingRoster
      summary: Inspect an account's roster
      x-required-role: admin
      description: >-
        Returns the friend graph of a single account for moderation: each
        relationship's peer login, local nickname, state, and live online
        status. Admin role.
      tags: [Messaging]
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
          description: The bare account login whose roster to inspect.
      responses:
        '200':
          description: Account roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      login:
                        type: string
                      online:
                        type: boolean
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            login:
                              type: string
                            nickname:
                              type: string
                            state:
                              type: string
                              enum: [removed, pending_out, pending_in, accepted, blocked]
                            online:
                              type: boolean
                            created_at:
                              type: integer
                              description: Unix seconds the relationship row was created.
                      total:
                        type: integer
        '400':
          description: A single login is required
        '404':
          description: Messaging extension not enabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Role-based API key. Configure keys with roles (viewer, operator,
        admin) in the server config.yaml under `APIKeys`. Keys are compared
        in constant time, and the role hierarchy is
        admin > operator > viewer.

        When no keys are configured at all, every request is refused with
        `401` unless the operator has explicitly set `APIOpenAccess: true`,
        which drops authentication entirely and serves every endpoint —
        including account administration and shutdown — to anyone who can
        reach the port.

  schemas:
    VolumeStatus:
      type: object
      properties:
        file_root:
          type: string
        image_path:
          type: string
        mounted:
          type: boolean
          description: >
            False when the image is missing or failed to open. Such a root
            serves nothing and does not fall back to the host filesystem.
        total_bytes:
          type: integer
          format: int64
        free_bytes:
          type: integer
          format: int64
        largest_free_extent_bytes:
          type: integer
          format: int64
          description: >
            The largest file that can still be stored whole. A volume with room
            in many small pieces refuses an upload that free_bytes alone says
            should fit.
        catalog_used_nodes:
          type: integer
          description: >
            The catalog is the third way a volume fills: room for the bytes, no
            room to record the file.
        catalog_total_nodes:
          type: integer
    User:
      type: object
      description: >
        One connected session. Optional keys are omitted rather than sent
        empty or false, so a missing key means the session does not have
        that property — `invisible` absent means visible, `version` absent
        means the client never sent one.
      properties:
        id:
          type: integer
          description: Session (user) ID, 16-bit
        nickname:
          type: string
        login:
          type: string
          description: >
            Account login, or "" for a session that has arrived but not yet
            authenticated. A failed login is listable for as long as the
            attempt takes.
        ip:
          type: string
        icon:
          type: integer
        idle:
          type: integer
          description: Seconds since the session last did anything
        encrypted:
          type: boolean
        encryption_mode:
          type: string
          description: >
            "none", or the negotiated HOPE transport as
            "aead/<cipher>" / "stream/<cipher>", with "+<compression>"
            appended when compression was negotiated.
        file_transfer_encrypted:
          type: boolean
        version:
          type: integer
          description: Client protocol version; omitted when unknown
        text_encoding:
          type: string
          description: e.g. "utf-8", "mac_roman", "shift-jis", "latin-1"
        hope_algorithm:
          type: string
        hope_cipher:
          type: string
        large_files:
          type: boolean
          description: Present only when the client negotiated 64-bit sizes
        color:
          type: string
          description: Nickname colour as "#rrggbb"; omitted when unset
        has_gif_icon:
          type: boolean
        invisible:
          type: boolean
        blocked_download:
          type: boolean
        auto_reply:
          type: string
    Account:
      type: object
      description: >
        A stored account. `file_root`, `disk_quota` and `max_bandwidth` are
        omitted when unset, so an absent key means "inherit the server
        default", not zero.
      properties:
        login:
          type: string
        name:
          type: string
          description: Display name shown to other users
        access:
          $ref: '#/components/schemas/AccessFlags'
        red_name:
          type: boolean
          description: >
            Admin appearance (red name) without the disconnect_user
            privilege
        has_hope_password:
          type: boolean
          description: >
            True when the account also carries a HOPE secure-login
            credential. The credential itself is never returned, and neither
            is the ordinary password hash.
        file_root:
          type: string
          description: Custom FileRoot for this account
        disk_quota:
          type: integer
          format: int64
          description: Per-account upload quota in bytes
        max_bandwidth:
          type: integer
          description: Per-account download cap in bytes/sec
    Envelope:
      type: object
      properties:
        ok:
          type: boolean
        data:
          description: Response payload (varies by endpoint)
    ErrorEnvelope:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        error:
          type: string
        code:
          type: string

    ServerConfig:
      type: object
      description: Server configuration (safe subset exposed via API)
      properties:
        name:
          type: string
          description: Server name
        description:
          type: string
          description: Server description
        enable_tracker:
          type: boolean
          description: Whether tracker registration is enabled
        trackers:
          type: array
          items:
            type: object
          description: Configured tracker entries
        max_downloads:
          type: integer
          description: Global simultaneous download limit
        max_downloads_per_client:
          type: integer
          description: Per-client download limit
        max_connections_per_ip:
          type: integer
          description: Maximum concurrent connections per IP address
        banner_file:
          type: string
          description: Banner image file name
        ignore_files:
          type: array
          items:
            type: string
          description: File name patterns to hide from directory listings
        max_gif_icon_size:
          type: integer
          description: Maximum allowed GIF icon size in bytes
        allow_large_files:
          type: boolean
          description: Whether 64-bit file size support is enabled
        large_file_clients:
          type: array
          items:
            type: string
          description: Client identifiers that support large files
        default_text_encoding:
          type: string
          description: Default text encoding for client communication
        enable_hope:
          type: boolean
          description: Whether HOPE secure login is enabled
        hope_app_id:
          type: string
          description: HOPE application identifier
        hope_app_string:
          type: string
          description: HOPE application string
        new_user_defaults:
          type: object
          additionalProperties:
            type: boolean
          description: >
            Access template applied to accounts created without explicit
            access bits. Reported verbatim from config.yaml, so its keys are
            the PascalCase names used in the per-account YAML files
            (`DownloadFile`, `ReadChat`, ...) — not the snake_case names the
            `access` object of the account endpoints uses.

    AccessFlags:
      type: object
      description: >
        Boolean access privilege flags. Each key corresponds to a privilege bit
        in the Hotline access bitmap. See the protocol docs for the full bitmap.
      properties:
        download_file:
          type: boolean
          description: "Bit 2: Can download files"
        download_folder:
          type: boolean
          description: "Bit 39: Can download folders"
        upload_file:
          type: boolean
          description: "Bit 1: Can upload files"
        upload_folder:
          type: boolean
          description: "Bit 38: Can upload folders"
        delete_file:
          type: boolean
          description: "Bit 0: Can delete files"
        rename_file:
          type: boolean
          description: "Bit 3: Can rename files"
        move_file:
          type: boolean
          description: "Bit 4: Can move files"
        create_folder:
          type: boolean
          description: "Bit 5: Can create folders"
        delete_folder:
          type: boolean
          description: "Bit 6: Can delete folders"
        rename_folder:
          type: boolean
          description: "Bit 7: Can rename folders"
        move_folder:
          type: boolean
          description: "Bit 8: Can move folders"
        read_chat:
          type: boolean
          description: "Bit 9: Can read chat"
        send_chat:
          type: boolean
          description: "Bit 10: Can send chat"
        open_chat:
          type: boolean
          description: "Bit 11: Can create private chat rooms"
        close_chat:
          type: boolean
          description: "Bit 12: Can close private chat rooms"
        show_in_list:
          type: boolean
          description: "Bit 13: Visible in the user list"
        create_user:
          type: boolean
          description: "Bit 14: Can create accounts"
        delete_user:
          type: boolean
          description: "Bit 15: Can delete accounts"
        open_user:
          type: boolean
          description: "Bit 16: Can view account details"
        modify_user:
          type: boolean
          description: "Bit 17: Can modify accounts"
        change_own_pass:
          type: boolean
          description: "Bit 18: Can change own password"
        send_priv_msg:
          type: boolean
          description: "Bit 19: Phantom bit — documented in 1.9 spec but never enforced by real Hotline servers"
        news_read_art:
          type: boolean
          description: "Bit 20: Can read news articles"
        news_post_art:
          type: boolean
          description: "Bit 21: Can post news articles"
        disconnect_user:
          type: boolean
          description: "Bit 22: Can disconnect (kick) users"
        cannot_be_disconnected:
          type: boolean
          description: "Bit 23: Cannot be disconnected by other users"
        get_client_info:
          type: boolean
          description: "Bit 24: Can view client info (Get Info)"
        upload_anywhere:
          type: boolean
          description: "Bit 25: Can upload to any folder"
        any_name:
          type: boolean
          description: "Bit 26: Can use any nickname"
        no_agreement:
          type: boolean
          description: "Bit 27: Skips the server agreement on login"
        set_file_comment:
          type: boolean
          description: "Bit 28: Can set file comments"
        set_folder_comment:
          type: boolean
          description: "Bit 29: Can set folder comments"
        view_drop_boxes:
          type: boolean
          description: "Bit 30: Can view drop box folder contents"
        make_alias:
          type: boolean
          description: "Bit 31: Can create file aliases"
        broadcast:
          type: boolean
          description: "Bit 32: Can send server broadcast messages"
        news_delete_art:
          type: boolean
          description: "Bit 33: Can delete news articles"
        news_create_cat:
          type: boolean
          description: "Bit 34: Can create news categories"
        news_delete_cat:
          type: boolean
          description: "Bit 35: Can delete news categories"
        news_create_fldr:
          type: boolean
          description: "Bit 36: Can create news bundles (folders)"
        news_delete_fldr:
          type: boolean
          description: "Bit 37: Can delete news bundles (folders)"
        send_message:
          type: boolean
          description: "Bit 40: Can send private messages"
        set_user_red:
          type: boolean
          description: "Bit 41: Can flag users as red (GLoarbLine extended)"
        set_user_away:
          type: boolean
          description: "Bit 42: Can set users as away (GLoarbLine extended)"
        change_other_nick:
          type: boolean
          description: "Bit 43: Can change other users' nicknames (GLoarbLine extended)"
        change_other_icon:
          type: boolean
          description: "Bit 44: Can change other users' icons (GLoarbLine extended)"
        speak_before_exempt:
          type: boolean
          description: "Bit 45: Exempt from speak-before-enter requirement (GLoarbLine extended)"
        allow_refuse_chat:
          type: boolean
          description: "Bit 46: Can refuse private chat invitations (GLoarbLine extended)"
        block_download:
          type: boolean
          description: "Bit 47: Downloads are blocked for this user (GLoarbLine extended)"
        set_user_visible:
          type: boolean
          description: "Bit 48: Can set user visibility (GLoarbLine extended)"
        view_invisible:
          type: boolean
          description: "Bit 49: Can see invisible users (GLoarbLine extended)"
        flood_exempt:
          type: boolean
          description: "Bit 50: Exempt from flood protection (GLoarbLine extended)"
        view_own_drop_box:
          type: boolean
          description: "Bit 51: Can view own drop box contents (GLoarbLine extended)"
        queue_exempt:
          type: boolean
          description: "Bit 52: Exempt from download queue (GLoarbLine extended)"
        admin_inspector:
          type: boolean
          description: "Bit 53: Can use admin inspector (GLoarbLine extended)"
        post_before_exempt:
          type: boolean
          description: "Bit 54: Exempt from post-before-enter requirement (GLoarbLine extended)"
        voice_chat:
          type: boolean
          description: "Bit 55: Can join voice chat rooms"
        read_chat_history:
          type: boolean
          description: "Bit 56: Can request chat history replay"
        send_media:
          type: boolean
          description: "Bit 57: Can attach inline images in chat (inline media extension)"
        messaging:
          type: boolean
          description: "Bit 58: Can use the IM/roster/presence subsystem (messaging extension)"

  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: API key lacks required role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

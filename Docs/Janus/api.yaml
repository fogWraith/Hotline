openapi: 3.0.3
info:
  title: Janus API
  description: |
    REST API for managing the Janus Hotline server.

    ## Response envelope

    Every response — success and failure alike — is a JSON envelope.
    A success carries the endpoint's payload under `data`:

    ```json
    { "ok": true, "data": { ... } }
    ```

    A failure carries a human-readable message and a stable machine code:

    ```json
    { "ok": false, "error": "account not found", "code": "NOT_FOUND" }
    ```

    Codes in use: `BAD_REQUEST`, `UNAUTHORIZED`, `FORBIDDEN`, `NOT_FOUND`,
    `METHOD_NOT_ALLOWED`, `CONFLICT`, `NOT_VOLUME_BACKED`, `ALREADY_MOUNTED`,
    `ALREADY_EXISTS`, `UNKNOWN_FILE_ROOT`, `UNAVAILABLE`, `INTERNAL`.

    Where a `200` response below has no schema, the body is still this
    envelope with the described fields inside `data`.

    The one exception is a request to a path this document does not list:
    that is refused by the HTTP router before any handler runs, and comes
    back as a plain-text `404`, not an envelope.

    ## Roles

    Every operation carries an `x-required-role` of `viewer`, `operator`, or
    `admin`. The roles are a hierarchy — an `admin` key satisfies an
    `operator` requirement, and an `operator` key satisfies a `viewer` one.
    A key below the required role gets `403`; an unrecognised or absent key
    gets `401`.

    Note that a role is per *operation*, not per path: listing the message
    board is `viewer` while reading one post is `operator`, and listing
    transfers is `viewer` while reading one is `admin`. Read the annotation
    on the operation you intend to call.

    ## Method handling

    Every endpoint answers a method it does not implement with `405` and
    code `METHOD_NOT_ALLOWED`. These are omitted from the per-operation
    response lists except where a path is shared by several methods with
    different roles.
  version: 2.4.1
  contact:
    name: fogWraith
    url: https://github.com/fogWraith
servers:
  - url: http://localhost:8973
    description: Local server
security:
  - ApiKeyAuth: []

paths:
  # --- Status & Health ---
  /api/v2/status:
    get:
      operationId: getStatus
      summary: Server status
      x-required-role: viewer
      description: Returns server name, description, version, uptime, and current online user count.
      tags: [Status]
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      version:
                        type: string
                        description: Janus build version.
                      uptime_secs:
                        type: integer
                      online:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/health:
    get:
      operationId: getHealth
      summary: Health check
      x-required-role: viewer
      description: >
        Always answers `status: "ok"` when the API is serving; it is a
        liveness check, not a check of any subsystem. Note that it is not
        anonymous — it needs a viewer key like everything else.
      tags: [Status]
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      uptime_secs:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/metrics:
    get:
      operationId: getMetrics
      summary: Server metrics
      x-required-role: viewer
      description: >
        Returns the server's raw counters and gauges. These come straight
        from the internal stats table, so — unlike every other endpoint —
        the keys are PascalCase.
      tags: [Status]
      responses:
        '200':
          description: Metrics object
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      CurrentlyConnected:
                        type: integer
                      DownloadsInProgress:
                        type: integer
                      UploadsInProgress:
                        type: integer
                      WaitingDownloads:
                        type: integer
                      ConnectionPeak:
                        type: integer
                      ConnectionCounter:
                        type: integer
                      DownloadCounter:
                        type: integer
                      UploadCounter:
                        type: integer
                      Since:
                        type: string
                        format: date-time
                        description: When the server started.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/mnemosyne/metrics:
    get:
      operationId: getMnemosyneMetrics
      summary: Mnemosyne subsystem metrics
      x-required-role: viewer
      description: |
        Returns a point-in-time snapshot of the in-core Mnemosyne content
        sync subsystem.  Returns 404 when the subsystem is disabled via
        config.yaml.
      tags: [Status]
      responses:
        '200':
          description: Mnemosyne counter snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      events_received:
                        type: integer
                        format: int64
                        description: Total events pushed onto the internal queue.
                      events_dropped:
                        type: integer
                        format: int64
                        description: Events dropped because the bounded queue was full.
                      chunks:
                        type: integer
                        format: int64
                        description: Successful chunk POSTs (any content type).
                      retries:
                        type: integer
                        format: int64
                        description: HTTP retry attempts across all requests.
                      bytes_sent:
                        type: integer
                        format: int64
                        description: Total request body bytes sent.
                      last_heartbeat_at:
                        type: integer
                        format: int64
                        description: Unix seconds of last successful heartbeat (0 if none).
                      last_full_sync_at:
                        type: integer
                        format: int64
                        description: Unix seconds of last successful full sync (0 if none).
                      last_error_at:
                        type: integer
                        format: int64
                        description: Unix seconds of last HTTP error (0 if none).
        '404':
          description: Mnemosyne subsystem is not enabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- NewsBridge (NNTP <-> Hotline news gateway) ---
  /api/v2/newsbridge/status:
    get:
      operationId: getNewsBridgeStatus
      summary: NewsBridge subsystem status
      x-required-role: viewer
      description: |
        Returns a JSON snapshot of NewsBridge's per-server / per-group
        state: connection state, queue depths, last poll time, and
        per-group high-water marks. 404 when the subsystem is disabled
        via `config.yaml`.
      tags: [NewsBridge]
      responses:
        '200':
          description: NewsBridge status snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    description: Per-server / per-group state snapshot.
        '404':
          description: NewsBridge subsystem is not enabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/newsbridge/audit:
    get:
      operationId: listNewsBridgeAudit
      summary: NewsBridge audit log
      x-required-role: operator
      description: |
        Returns recent rows from the NewsBridge audit table (inbound and
        outbound article activity, errors, retries). 404 when disabled.
      tags: [NewsBridge]
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: |
            RFC 3339 timestamp or Unix seconds. Default: 24 hours ago.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
          description: Maximum number of rows to return.
      responses:
        '200':
          description: Audit rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid `since` or `limit` parameter.
        '404':
          description: NewsBridge subsystem is not enabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/newsbridge/groups/{server}/{group}/reset:
    post:
      operationId: resetNewsBridgeGroup
      summary: Reset a group's high-water mark
      x-required-role: admin
      description: |
        Forces a re-import of the named NNTP group on the next poll
        cycle by clearing its stored cursor. Use this after fixing a
        bad mapping or recovering from a corrupted upstream feed.
      tags: [NewsBridge]
      parameters:
        - name: server
          in: path
          required: true
          schema:
            type: string
          description: Configured NewsBridge server `Name`.
        - name: group
          in: path
          required: true
          schema:
            type: string
          description: NNTP group name (e.g. `local.hotline.general`).
      responses:
        '200':
          description: Group cursor reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: reset
                      server:
                        type: string
                      group:
                        type: string
        '400':
          description: Invalid path or unknown server/group.
        '404':
          description: NewsBridge subsystem is not enabled.
        '405':
          description: Method not allowed (POST only).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/newsbridge/outbound:
    get:
      operationId: listNewsBridgeOutbound
      summary: List outbound queue entries
      x-required-role: operator
      description: |
        Returns rows from the Hotline-to-NNTP outbound queue. Useful
        for inspecting deliveries and diagnosing failed sends.
      tags: [NewsBridge]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, sent, failed]
          description: Filter by delivery status. Default = all.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        '200':
          description: Outbound rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: array
                    items:
                      type: object
        '400':
          description: Invalid `status` or `limit` parameter.
        '404':
          description: NewsBridge subsystem is not enabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/newsbridge/outbound/{id}/retry:
    post:
      operationId: retryNewsBridgeOutbound
      summary: Retry a failed outbound delivery
      x-required-role: operator
      description: |
        Moves a failed outbound row back to `pending` so it will be
        picked up on the next poll cycle.
      tags: [NewsBridge]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Outbound row id from `/newsbridge/outbound`.
      responses:
        '200':
          description: Row queued for retry.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: retry
                      id:
                        type: integer
                        format: int64
        '400':
          description: Invalid id or row not in failed state.
        '404':
          description: NewsBridge subsystem is not enabled.
        '405':
          description: Method not allowed (POST only).
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Users ---
  /api/v2/users:
    get:
      operationId: listUsers
      summary: List online users
      x-required-role: viewer
      description: >
        Returns all currently connected sessions with nickname, login, IP,
        icon, version, and negotiated protocol extensions. Invisible users
        are included — this is an operator view, not the user list a client
        sees.
      tags: [Users]
      responses:
        '200':
          description: List of online users
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/users/{uid}/session:
    get:
      operationId: getUserSession
      summary: Get user session details
      x-required-role: operator
      description: >
        The same fields as the list endpoint plus `capabilities` (the two
        capability bytes rendered as binary) and `dupe_msg_count`. Unlike
        the list, the booleans `has_gif_icon`, `invisible` and
        `blocked_download` are always present here.
      tags: [Users]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User session info
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    allOf:
                      - $ref: '#/components/schemas/User'
                      - type: object
                        properties:
                          capabilities:
                            type: string
                            description: >
                              The two capability bytes as binary, e.g.
                              "10110000 00000001".
                          dupe_msg_count:
                            type: integer
        '400':
          description: Invalid user ID
        '404':
          description: No session with that ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/users/{uid}/kick:
    post:
      operationId: kickUser
      summary: Kick a user
      x-required-role: operator
      tags: [Users]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User kicked
        '400':
          description: Invalid user ID
        '404':
          description: No session with that ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/users/{uid}/temp-ban:
    post:
      operationId: tempBanUser
      summary: Temp-ban and disconnect a user
      x-required-role: operator
      tags: [Users]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_minutes]
              properties:
                duration_minutes:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: User banned
        '400':
          description: Invalid user ID, or a body with duration_minutes must be a positive integer
        '404':
          description: No session with that ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/users/{uid}/message:
    post:
      operationId: sendUserMessage
      summary: Send a private message to a user
      x-required-role: operator
      tags: [Users]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Message sent
        '400':
          description: Invalid user ID, or a body with empty or missing message
        '404':
          description: No session with that ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/users/{uid}/auto-reply:
    post:
      operationId: setUserAutoReply
      summary: Set or clear a user's auto-reply message
      x-required-role: operator
      description: |
        Updates the `AutoReply` field on the live `ClientConn`. An empty
        `message` clears any existing auto-reply.
      tags: [Users]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Auto-reply updated
        '400':
          description: Invalid user ID
        '404':
          description: No session with that ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/users/{uid}/block-download:
    post:
      operationId: setUserBlockDownload
      summary: Block or unblock downloads for a user
      x-required-role: operator
      description: |
        Toggles the per-session `BlockedDownload` flag on the live
        `ClientConn`. Downloads remain blocked until the flag is cleared
        or the user disconnects.
      tags: [Users]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked:
                  type: boolean
      responses:
        '200':
          description: Block state updated
        '400':
          description: Invalid user ID
        '404':
          description: No session with that ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/users/{uid}/invisibility:
    post:
      operationId: setUserInvisibility
      summary: Make a user invisible or visible
      x-required-role: operator
      description: |
        Toggles the per-session `Invisible` flag on the live `ClientConn`,
        hiding (or revealing) the user from the user list broadcast.
      tags: [Users]
      parameters:
        - name: uid
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invisible]
              properties:
                invisible:
                  type: boolean
      responses:
        '200':
          description: Invisibility state updated
        '400':
          description: Invalid user ID
        '404':
          description: No session with that ID
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Broadcast ---
  /api/v2/broadcast:
    post:
      operationId: broadcastMessage
      summary: Broadcast a message to all users
      x-required-role: admin
      tags: [Server]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
      responses:
        '200':
          description: Message broadcast
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      msg:
                        type: string
                      recipients:
                        type: integer
                        description: Sessions connected when the message went out.
        '400':
          description: Malformed body, or an empty message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Server Info ---
  /api/v2/server/agreement:
    get:
      operationId: getAgreement
      summary: Get server agreement text
      x-required-role: viewer
      description: >
        A server with no agreement configured answers 200 with an empty
        `agreement` string rather than 404.
      tags: [Server]
      responses:
        '200':
          description: Agreement text
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      agreement:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      operationId: updateAgreement
      summary: Update server agreement text
      x-required-role: admin
      description: >
        Replaces the agreement and writes it to disk. Sending an empty
        `text` clears the agreement.
      tags: [Server]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        '200':
          description: Agreement updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/server/banner:
    get:
      operationId: getBanner
      summary: Get server banner info
      x-required-role: viewer
      description: >
        Reports whether a banner is loaded and how large it is. `file` is
        present only when a banner is loaded. The banner image itself is
        not served here.
      tags: [Server]
      responses:
        '200':
          description: Banner metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      has_banner:
                        type: boolean
                      size:
                        type: integer
                        description: Banner size in bytes.
                      file:
                        type: string
                        description: Configured BannerFile name.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/server/config:
    get:
      operationId: getServerConfig
      summary: Get server configuration
      x-required-role: viewer
      description: >
        Returns the current server configuration. Does not include
        sensitive fields (passwords, API keys, file system paths beyond
        BannerFile and IgnoreFiles).
      tags: [Server]
      responses:
        '200':
          description: Server configuration values
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/ServerConfig'
              example:
                ok: true
                data:
                  name: "My Server"
                  description: "A Hotline server"
                  enable_tracker: true
                  trackers: []
                  max_downloads: 10
                  max_downloads_per_client: 3
                  max_connections_per_ip: 5
                  banner_file: "banner.jpg"
                  ignore_files: ["Icon\r", ".DS_Store"]
                  max_gif_icon_size: 32768
                  allow_large_files: false
                  large_file_clients: []
                  default_text_encoding: "mac_roman"
                  enable_hope: false
                  hope_app_id: ""
                  hope_app_string: ""
                  new_user_defaults:
                    DownloadFile: true
                    DownloadFolder: true
                    ReadChat: true
                    SendChat: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/server/tls:
    get:
      operationId: getTLSStatus
      summary: Get TLS status
      x-required-role: viewer
      description: >
        Reports whether the server is listening for TLS Hotline
        connections. `port` and `file_transfer_port` are present only when
        TLS is enabled; the file transfer port is always the TLS port plus
        one.
      tags: [Server]
      responses:
        '200':
          description: TLS configuration info
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                      port:
                        type: integer
                      file_transfer_port:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/server/reload:
    post:
      operationId: reloadServer
      summary: Reload server configuration
      x-required-role: admin
      description: >
        Hot-reloads server configuration. If a targets array is provided,
        only those subsystems are reloaded. If omitted, everything is reloaded.
      tags: [Server]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targets:
                  type: array
                  items:
                    type: string
                    enum: [agreement, banner, bans, filetypes, msgboard, news, plugins]
      responses:
        '200':
          description: Configuration reloaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      msg:
                        type: string
                        description: >
                          "config reloaded", or "reloaded: a, b" naming the
                          targets that were reloaded.
        '400':
          description: Malformed body, or an unrecognised reload target
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/server/shutdown:
    post:
      operationId: shutdownServer
      summary: Gracefully shutdown the server
      x-required-role: admin
      description: >
        Sends a disconnect message to all clients, then shuts down. The
        response is written before the shutdown begins, so a 200 here means
        the shutdown was accepted, not that it has finished.
      tags: [Server]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                  description: Message sent to all clients before shutdown
      responses:
        '200':
          description: Server shutting down
        '400':
          description: Malformed body, or an empty message
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Authentication ---
  /api/v2/auth/verify:
    post:
      operationId: verifyCredentials
      summary: Verify account credentials
      x-required-role: admin
      description: >
        Checks a login/password pair against the account database without
        creating a session. Intended for a trusted front end (such as the
        Agora web site) that needs to authenticate a visitor as their Hotline
        account.


        A wrong password is not an error: the response is 200 with
        `valid: false` and no account details. Account details are returned
        only on a successful verification. Unknown logins and wrong passwords
        are indistinguishable, including in response time.


        The password is supplied in the clear (send this over TLS or a trusted
        network only).
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
                  description: Clear-text password (may be empty for passwordless accounts)
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    description: >
                      When `valid` is false this is the single field
                      `{ "valid": false }`. When true it is the full
                      Account object with `valid: true` added.
                    allOf:
                      - $ref: '#/components/schemas/Account'
                      - type: object
                        properties:
                          valid:
                            type: boolean
                            description: >
                              True when the password matches the account.
        '400':
          description: Malformed body or missing login
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Accounts ---
  /api/v2/accounts:
    get:
      operationId: listAccounts
      summary: List all accounts
      x-required-role: admin
      tags: [Accounts]
      responses:
        '200':
          description: List of accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/Account'
                      total:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createAccount
      summary: Create a new account
      x-required-role: admin
      description: |
        Creates a new account. If the `access` field is omitted or contains
        no enabled bits, the server applies the `NewUserDefaults` template
        from config.yaml (if configured).

        Unlike account creation over the Hotline protocol, there is no
        "creator cannot grant more access than themselves" ceiling here: an
        admin key can grant any privilege bit, because an API key is not an
        account and has no bitmap of its own to be measured against.
        Unrecognised keys in `access` are ignored rather than rejected.
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login:
                  type: string
                name:
                  type: string
                password:
                  type: string
                  description: >
                    Clear-text account password (may be empty for passwordless
                    accounts). Stored the same way a password set through a
                    Hotline client is, so the account can log in with it. Must
                    satisfy the server's configured password policy.
                access:
                  $ref: '#/components/schemas/AccessFlags'
                file_root:
                  type: string
                  description: Custom FileRoot path for this account (empty = server default)
                disk_quota:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Per-account upload quota in bytes (0 = use server default)
                max_bandwidth:
                  type: integer
                  minimum: 0
                  description: Per-account download bandwidth cap in bytes/sec (0 = inherit server MaxBandwidthPerClient)
                red_name:
                  type: boolean
                  description: Admin appearance (red name) without requiring disconnect_user privilege
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          description: >
            Missing login, or a password failing the server's password policy
        '409':
          description: An account with this login already exists
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/accounts/{login}:
    get:
      operationId: getAccount
      summary: Get account by login
      x-required-role: admin
      tags: [Accounts]
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account details
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '404':
          description: Account not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateAccount
      summary: Update an account
      x-required-role: admin
      description: |
        Every field is optional; only the fields present are changed. The one
        exception is `access`, which is a whole-bitmap replacement rather
        than a merge — sending it with a subset of bits revokes every bit
        not listed. Unrecognised bit names are ignored.

        Renaming the login or revoking the `messaging` bit also updates the
        messaging friend graph, and a changed `max_bandwidth` is applied to
        that account's live sessions without a reconnect.
      tags: [Accounts]
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                login:
                  type: string
                  description: New login name (renames the account)
                password:
                  type: string
                  description: >
                    Clear-text replacement password. Omit or send an empty
                    string to leave the current password unchanged. Must
                    satisfy the server's configured password policy.
                access:
                  $ref: '#/components/schemas/AccessFlags'
                file_root:
                  type: string
                  description: Custom FileRoot path for this account (empty = server default)
                disk_quota:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Per-account upload quota in bytes (0 = use server default)
                max_bandwidth:
                  type: integer
                  minimum: 0
                  description: Per-account download bandwidth cap in bytes/sec (0 = inherit server MaxBandwidthPerClient)
                red_name:
                  type: boolean
                  description: Admin appearance (red name) without requiring disconnect_user privilege
      responses:
        '200':
          description: Account updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Account'
        '400':
          description: Malformed body, or a password failing the password policy
        '404':
          description: Account not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteAccount
      summary: Delete an account
      x-required-role: admin
      tags: [Accounts]
      parameters:
        - name: login
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account deleted
        '404':
          description: Account not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Bans ---
  /api/v2/temp-bans:
    get:
      operationId: listBans
      summary: List all bans
      x-required-role: admin
      description: Returns IP bans (with expiry/reason), banned usernames, and banned nicknames.
      tags: [Bans]
      responses:
        '200':
          description: Ban lists
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createBan
      summary: Add a ban
      x-required-role: admin
      description: |
        Ban by IP (with optional duration/reason), username, and/or
        nickname. At least one of `ip`, `username`, or `nickname` must be
        supplied; supplying several applies several bans in one call, and
        the response echoes back whichever were applied.

        `duration_minutes` applies only to the IP ban. Omitting it (or
        sending 0) makes the IP ban permanent. Username and nickname bans
        never expire.
      tags: [Bans]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ip:
                  type: string
                username:
                  type: string
                nickname:
                  type: string
                duration_minutes:
                  type: integer
                reason:
                  type: string
      responses:
        '201':
          description: Ban added
        '400':
          description: None of `ip`, `username`, or `nickname` was supplied
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/temp-bans/ip/{addr}:
    delete:
      operationId: unbanIP
      summary: Unban an IP address
      x-required-role: admin

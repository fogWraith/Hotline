          required: true
          schema:
            type: string
      responses:
        '200':
          description: IP unbanned
        '404':
          description: The address is not in the ban list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/temp-bans/username/{name}:
    delete:
      operationId: unbanUsername
      summary: Unban a username
      x-required-role: admin
      tags: [Bans]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Username unbanned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/temp-bans/nickname/{name}:
    delete:
      operationId: unbanNickname
      summary: Unban a nickname
      x-required-role: admin
      tags: [Bans]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Nickname unbanned
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # --- Message Board ---
  /api/v2/msgboard:

            type: string
          description: Slash-delimited category path (omit for the root)
        - name: tree
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: >
            When set to `1`, returns the full recursive category tree
            rooted at `path` instead of a flat listing.
      responses:
        '200':
          description: List of categories
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':

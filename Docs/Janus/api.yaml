  # --- News Articles ---
  /api/v2/news/articles:
    get:
      operationId: listNewsArticles
      summary: List articles in a category
      x-required-role: viewer
      description: >
        Without pagination/filter parameters, returns all articles in the
        category. Supplying any of `limit`, `before`, `parent_id`, or
        `thread_only` switches to the paged variant.
      tags: [News]
      parameters:
        - name: path
          in: query
          schema:
            type: string
          description: Slash-delimited category path
        - name: limit
          in: query
          schema:
            type: integer
          description: Maximum number of articles to return (0 = unbounded)
        - name: before
          in: query
          schema:
            type: integer
          description: Return articles with IDs lower than this ID (cursor pagination)
        - name: parent_id
          in: query
          schema:
            type: integer
          description: Return only direct replies to this article ID
        - name: thread_only
          in: query
          schema:
            type: string
            enum: ["0", "1", "true", "false"]
          description: When `1` or `true`, return only top-level articles (no replies)
      responses:
        '200':
          description: List of articles
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createNewsArticle
      summary: Post a news article
      x-required-role: operator
      tags: [News]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                path:
                  type: array
                  items:
                    type: string
                  description: >
                    Category path components. Omit for the news root.
                title:
                  type: string
                body:
                  type: string
                poster:
                  type: string
                parent_id:
                  type: integer
                  description: >
                    Post as a reply to this article ID. Omit or send 0 to
                    start a new thread.
      responses:
        '201':
          description: Article posted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/news/articles/{id}:
    get:
      operationId: getNewsArticle
      summary: Get article by ID
      x-required-role: operator
      tags: [News]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: path
          in: query
          schema:
            type: string
          description: Slash-delimited category path
      responses:
        '200':
          description: Article details
        '400':
          description: Invalid article ID
        '404':
          description: Article not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateNewsArticle
      summary: Update article title/body
      x-required-role: operator
      tags: [News]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: path
          in: query
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        '200':
          description: Article updated
        '400':
          description: Invalid article ID, or neither `title` nor `body` supplied
        '404':
          description: Article not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteNewsArticle
      summary: Delete an article
      x-required-role: operator
      tags: [News]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: path
          in: query
          schema:
            type: string
        - name: recursive
          in: query
          schema:
            type: string
            enum: ["0", "1"]
          description: |
            When set to `1`, deletes the article and all its child replies.
            Default `0` (delete only the specified article).
      responses:
        '200':
          description: Article deleted
        '400':
          description: Invalid article ID
        '404':
          description: Article not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/news/articles/{id}/replies:
    get:
      operationId: listNewsArticleReplies
      summary: List replies to an article
      x-required-role: operator
      description: Returns the direct child replies of the given article.
      tags: [News]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: path
          in: query
          schema:
            type: string
          description: Slash-delimited category path
      responses:
        '200':
          description: Reply list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                ok: true
                data:
                  parent_id: 42
                  replies: []
                  total: 0
                  path: ["General"]
        '404':
          description: Article or category not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/news/articles/by-ip/{ip}:
    delete:
      operationId: deleteNewsArticlesByIP
      summary: Delete all articles by IP
      x-required-role: admin
      description: >
        Deletes all news articles across all categories posted from the
        given IP address. Use the `since` query parameter to limit deletion
        to a time window.


        This path shares a prefix with `/api/v2/news/articles/{id}`, and the
        server routes on longest prefix — so `by-ip` is reserved here and is
        never read as an article ID.

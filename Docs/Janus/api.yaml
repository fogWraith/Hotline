            default of 50 is used.
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: A negative offset is ignored, and 0 is used.
      responses:
        '200':
          description: Paginated post list
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createMsgboardPost
